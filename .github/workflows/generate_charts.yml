name: Auto Generate and Commit Charts

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib seaborn

      - name: Execute script to create charts
        run: |
          cd Day_03_Visualizations
          python day3_visualizations.py

      - name: Commit and push generated PNG images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Day_03_Visualizations/*.png
          git commit -m "feat: auto-generate and commit 5 PNG chart images" || exit 0
          git push
